mode: rule
ipv6: false
allow-lan: true
mixed-port: 7890
keep-alive-interval: 15
find-process-mode: always
external-controller: 0.0.0.0:8899
secret: love
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - msftncsi.com
    - 131.107.255.255/32
    - msftconnecttest.com
    - localhost.ptlogin2.qq.com
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
proxies: []
proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - DIRECT      
      - Auto
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/Global.png
  - name: OneDrive
    type: select
    proxies:
      - DIRECT
      - Auto
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/OneDrive.png
  - name: Auto
    type: fallback
    filter: (日本|香港|新加坡|美国|韩国)(?!.*(3X|2X))
    interval: 300
    url: https://www.gstatic.com/generate_204
    use:
      - unicorn
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/Auto.png
  - name: AI
    type: fallback
    filter: (美国|韩国|日本)(?!.*(3X|2X))
    interval: 300
    url: https://www.gstatic.com/generate_204
    use:
      - unicorn
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/AI.png
rule-providers:
  proxy:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/non_ip/proxy.txt
  direct:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/non_ip/direct.txt
  onedrive:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/non_ip/onedrive.txt
  ai:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://ruleset.skk.moe/List/non_ip/ai.conf
rules:
  - RULE-SET,ai,AI
  - RULE-SET,onedrive,OneDrive
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Auto
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Auto