mode: rule
ipv6: false
allow-lan: true
mixed-port: 7890
keep-alive-interval: 15
find-process-mode: always
external-controller: 0.0.0.0:8899
secret: love
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - msftncsi.com
    - 131.107.255.255/32
    - msftconnecttest.com
    - localhost.ptlogin2.qq.com
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
proxy-providers:
  unicorn:
    type: http
    # 使用 {{ request.url }} 自动获取你调用接口时传入的 url 参数
    url: "https://sub.zhai.dev/sub?target=clash&list=true&url={{request.url}}"
    interval: 3600
    path: ./unicorn.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
proxies: []
proxy-groups: []
rules: []