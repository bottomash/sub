mode: rule
ipv6: false
allow-lan: true
mixed-port: 7890
keep-alive-interval: 15
find-process-mode: always
external-controller: 0.0.0.0:8899
secret: love
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - msftncsi.com
    - 131.107.255.255/32
    - msftconnecttest.com
    - localhost.ptlogin2.qq.com
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
proxies: []
proxy-groups: []
rule-providers:
  ai:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://ruleset.skk.moe/List/non_ip/ai.conf
  direct:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/direct.txt
  onedrive:
    type: http
    format: text
    interval: 86400
    behavior: classical
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/onedrive.txt
  proxy:
    type: http
    format: text
    interval: 86400
    behavior: classical
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/proxy.txt
rules:
  - RULE-SET,ai,AI
  - RULE-SET,proxy,Auto
  - RULE-SET,onedrive,OneDrive
  - RULE-SET,direct,DIRECT 
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Auto