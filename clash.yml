mode: rule
ipv6: false
allow-lan: true
mixed-port: 7890
keep-alive-interval: 15
find-process-mode: always
external-controller: 0.0.0.0:8899
secret: love
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - msftncsi.com
    - 131.107.255.255/32
    - msftconnecttest.com
    - localhost.ptlogin2.qq.com
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
rule-providers:
  ai:
    type: http
    behavior: classical
    url: https://raw.zhai.dev/bottomash/sub/latest/ai.txt
    path: ./ruleset/ai.yaml
    interval: 86400
  proxy:
    type: http
    behavior: classical
    url: https://raw.zhai.dev/bottomash/sub/latest/proxy.txt
    path: ./ruleset/proxy.yaml
    interval: 86400
  direct:
    type: http
    behavior: classical
    url: https://raw.zhai.dev/bottomash/sub/latest/direct.txt
    path: ./ruleset/direct.yaml
    interval: 86400
  onedrive:
    type: http
    behavior: classical
    url: https://raw.zhai.dev/bottomash/sub/latest/onedrive.txt
    path: ./ruleset/onedrive.yaml
    interval: 86400
