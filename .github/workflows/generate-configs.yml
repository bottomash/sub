name: Generate client configurations

on:
  push:
    branches:
      - latest
    paths:
      - sparkle/policy.yml
      - sparkle/rename.js
      - script/build-configs.mjs
      - script/package.json
      - script/package-lock.json
      - .github/workflows/generate-configs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-configs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: script/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: script

      - name: Generate client configurations
        run: npm run build
        working-directory: script

      - name: Commit generated configurations
        run: |
          if [[ -z "$(git status --porcelain -- sparkle/sparkle-override.js surge/policy.conf pref.yml)" ]]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sparkle/sparkle-override.js surge/policy.conf pref.yml
          git commit -m "chore: generate client configurations"
          git push
