name: Generate Surge config

on:
  push:
    branches:
      - latest
    paths:
      - sparkle/rule.yaml
      - scripts/build-surge.mjs
      - package.json
      - package-lock.json
      - .github/workflows/generate-surge.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-surge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Surge config
        run: npm run build:surge

      - name: Commit generated config
        run: |
          if [[ -z "$(git status --porcelain -- surge/rule.conf)" ]]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge/rule.conf
          git commit -m "chore: generate Surge config"
          git push
