proxy-groups:
  - name: GLOBAL
    type: select
    proxies:
      - DIRECT
      - Auto
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/Global.png
  - name: OneDrive
    type: select
    proxies:
      - DIRECT
      - Auto
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/OneDrive.png

  - name: PROXY
    type: select
    include-all: true
    exclude-filter: 3X|5X|10X
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/Proxy.png

  - name: Auto
    type: fallback
    interval: 300
    url: https://www.gstatic.com/generate_204
    proxies:
      - PROXY
    include-all: true
    exclude-filter: 3X|5X|10X  
    filter: (日本|香港|新加坡|美国|韩国|土耳其)
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/Auto.png

  - name: AI
    type: fallback
    interval: 300
    url: https://www.gstatic.com/generate_204
    filter: (美国|韩国|日本|新加坡)
    exclude-filter: 3X|5X|10X
    include-all: true
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/AI.png

rule-providers:
  ai:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/ai.txt
  proxy:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/proxy.txt
  direct:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/direct.txt
  onedrive:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/onedrive.txt

rules:
  - RULE-SET,ai,AI
  - RULE-SET,onedrive,OneDrive
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Auto
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Auto
