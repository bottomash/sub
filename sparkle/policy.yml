mode: rule
ipv6: false
allow-lan: true
mixed-port: 7890
keep-alive-interval: 15
find-process-mode: always
external-controller: 0.0.0.0:8899
secret: love
dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - msftncsi.com
    - 131.107.255.255/32
    - msftconnecttest.com
    - localhost.ptlogin2.qq.com
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxy-groups:
  - name: Global
    type: select
    proxies:
      - DIRECT
      - Auto
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/Global.png

  - name: AGI
    type: fallback
    interval: 300
    url: https://www.gstatic.com/generate_204
    filter: (美国|韩国|日本|新加坡)
    exclude-filter: 3X|5X|10X|家宽|星链|住宅|游戏
    include-all: true
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/AI.png

  - name: Auto
    type: fallback
    interval: 300
    url: https://www.gstatic.com/generate_204
    proxies:
      - PROXY
    include-all: true
    exclude-filter: 3X|5X|10X|家宽|星链|住宅|游戏
    filter: (日本|香港|新加坡|美国|韩国|土耳其)
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/Auto.png

  - name: PROXY
    type: select
    include-all: true
    exclude-filter: 3X|5X|10X|家宽|星链|住宅|游戏
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/Proxy.png

  - name: OneDrive
    type: select
    proxies:
      - DIRECT
      - Auto
    icon: https://raw.zhai.dev/Koolson/Qure/master/IconSet/Color/OneDrive.png

rule-providers:
  agi:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/agi.txt
  proxy:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/proxy.txt
  direct:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/direct.txt
  onedrive:
    type: http
    format: text
    behavior: classical
    interval: 86400
    url: https://raw.zhai.dev/bottomash/sub/latest/rule/onedrive.txt

rules:
  - RULE-SET,agi,AGI
  - RULE-SET,onedrive,OneDrive
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Auto
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Auto