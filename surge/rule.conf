# 此文件由 scripts/build-surge.mjs 根据 sparkle/rule.yaml 自动生成，请勿手动修改。

[Proxy Group]
GLOBAL = select, DIRECT, Auto
OneDrive = select, DIRECT, Auto
PROXY = select, include-all-proxies=true, policy-regex-filter="^(?!.*(?:3X|5X|10X)).*$"
Auto = fallback, PROXY, include-all-proxies=true, policy-regex-filter="^(?=.*(?:(日本|香港|新加坡|美国|韩国|土耳其)))(?!.*(?:3X|5X|10X)).*$", url=https://www.gstatic.com/generate_204, interval=300
AI = fallback, include-all-proxies=true, policy-regex-filter="^(?=.*(?:(美国|韩国|日本|新加坡)))(?!.*(?:3X|5X|10X)).*$", url=https://www.gstatic.com/generate_204, interval=300

[Rule]
RULE-SET,https://raw.zhai.dev/bottomash/sub/latest/rule/ai.txt,AI
RULE-SET,https://raw.zhai.dev/bottomash/sub/latest/rule/onedrive.txt,OneDrive
RULE-SET,https://raw.zhai.dev/bottomash/sub/latest/rule/direct.txt,DIRECT
RULE-SET,https://raw.zhai.dev/bottomash/sub/latest/rule/proxy.txt,Auto
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT
FINAL,Auto
