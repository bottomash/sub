[common]
clash_rule_base=clash.yml
surge_rule_base=surge/surge.conf
exclude_remarks=(3|5|10|20)[xX]|3X
[node_pref]
rename_node=x@X
rename_node=新加坡@狮城
rename_node=(\S{2})(\d{2}) (\|) (\w{2})@ $1 $2
rename_node=(丨)(\d{1,2}X) (\w{2})@ $2
rename_node=(ˣ¹)@ 1X
rename_node=(ˣ²)@ 2X
rename_node=(ˣ³)@ 3X
rename_node=(ˣ⁴)@ 4X
rename_node=(ˣ⁵)@ 5X
rename_node=(\p{Han}{2,5})(丨)@ $1$2
[ruleset]
enabled=true
overwrite_original_rules=true
update_ruleset_on_request=true
ruleset=AI,clash-domain:https://ruleset.skk.moe/List/non_ip/ai.conf
ruleset=Auto,clash-ipcidr:https://ruleset.skk.moe/List/ip/telegram.conf
ruleset=OneDrive,clash-domain:https://raw.zhai.dev/bottomash/sub/latest/rule/onedrive.txt
ruleset=DIRECT,clash-classic:https://raw.zhai.dev/bottomash/sub/latest/rule/direct.txt
ruleset=Auto,clash-classic:https://raw.zhai.dev/bottomash/sub/latest/rule/proxy.txt
ruleset=DIRECT,[]GEOIP,LAN
ruleset=DIRECT,[]GEOIP,CN
ruleset=Auto,[]MATCH
[proxy_groups]
custom_proxy_group=PROXY`select`!!PROVIDER=unicorn!!`(香港|狮城|日本)
custom_proxy_group=AI`fallback`!!PROVIDER=unicorn!!`(美国|新加坡|狮城|日本)`http://www.gstatic.com/generate_204`300,5
custom_proxy_group=Auto`fallback`!!PROVIDER=unicorn!!`(香港|狮城|日本)`http://www.gstatic.com/generate_204`300,5
custom_proxy_group=OneDrive`select`[]DIRECT`[]Auto
[server]
enable_cache=false