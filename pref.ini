[common]
clash_rule_base=clash.yml
exclude_remarks=(2|3|5|10|20)[xX]|3X|ˣ³|ˣ⁵|失联
[node_pref]
rename_node=(\d)x@$1X
rename_node=(\S{2})(\d{2}) (\|) (\w{2})@ $1 $2
rename_node=(丨)(\d{1,2}X) (\w{2})@ $2
rename_node=(ˣ¹)@ 1X
rename_node=(ˣ²)@ 2X
rename_node=(ˣ³)@ 3X
rename_node=(ˣ⁴)@ 4X
rename_node=(ˣ⁵)@ 5X
rename_node=(\p{Han}{2,5})(丨)@ $1$2
[custom_rules]
ruleset=AI,https://raw.zhai.dev/bottomash/sub/latest/rule/non_ip/ai.txt,86400
ruleset=Auto,https://raw.zhai.dev/bottomash/sub/latest/rule/non_ip/proxy.txt,86400
ruleset=DIRECT,https://raw.zhai.dev/bottomash/sub/latest/rule/non_ip/direct.txt,86400
ruleset=OneDrive,https://raw.zhai.dev/bottomash/sub/latest/rule/non_ip/onedrive.txt,86400
ruleset=DIRECT,[]GEOIP,LAN
ruleset=DIRECT,[]GEOIP,CN
ruleset=Auto,[]MATCH
[custom_groups]
custom_proxy_group=GLOBAL`select`DIRECT`Auto
custom_proxy_group=OneDrive`select`DIRECT`Auto
custom_proxy_group=Auto`fallback`(日本|香港|新加坡|美国|韩国)(?!.*(3X|2X))`https://www.gstatic.com/generate_204`300
custom_proxy_group=AI`fallback`(美国|韩国|日本)(?!.*(3X|2X))`https://www.gstatic.com/generate_204`300
[server]
enable_cache=false
new_name=true