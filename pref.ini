[common]
clash_rule_base=clash.yml
surge_rule_base=surge/surge.conf
exclude_remarks=(3|5|10|20)[xX]|3X
[node_pref]
rename_node=x@X
rename_node=新加坡@狮城
rename_node=(\S{2})(\d{2}) (\|) (\w{2})@ $1 $2
rename_node=(丨)(\d{1,2}X) (\w{2})@ $2
rename_node=(ˣ¹)@ 1X
rename_node=(ˣ²)@ 2X
rename_node=(ˣ³)@ 3X
rename_node=(ˣ⁴)@ 4X
rename_node=(ˣ⁵)@ 5X
rename_node=(\p{Han}{2,5})(丨)@ $1$2
[ruleset]
enabled=true
overwrite_original_rules=false
update_ruleset_on_request=true
[proxy_groups]
custom_proxy_group=PROXY`select`(香港|新加坡|美国|日本)
custom_proxy_group=AI`fallback``(香港|新加坡|美国|日本)`http://www.gstatic.com/generate_204`300,5
custom_proxy_group=Auto`fallback`[]PROXY`(香港|新加坡|美国|日本)`http://www.gstatic.com/generate_204`300,5
custom_proxy_group=OneDrive`select`[]DIRECT`[]Auto
[server]
enable_cache=false