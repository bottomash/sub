[common]
surge_rule_base=surge.conf
clash_rule_base=clash.yml
exclude_remarks=失联|家宽|游戏|(5|10|20)[xX]
[node_pref]
rename_node=x@X
rename_node=新加坡@狮城
rename_node=(\S{2})(\d{2}) (\|) (\w{2})@ $1 $2
rename_node=(丨)(\d{1,2}X) (\w{2})@ $2
rename_node=(ˣ¹)@ 1X
rename_node=(ˣ²)@ 2X
rename_node=(ˣ³)@ 3X
rename_node=(ˣ⁴)@ 4X
rename_node=(ˣ⁵)@ 5X
rename_node=(\p{Han}{2,5})(丨)@ $1$2
[rulesets]
enabled=true
overwrite_original_rules=true
update_ruleset_on_request=true
ruleset=DIRECT,https://raw.githubusercontent.com/bottomash/sub/latest/rule/direct.txt
ruleset=DIRECT,[]GEOIP,LAN
ruleset=DIRECT,[]GEOIP,CN
ruleset=PROXY,[]MATCH
[proxy_groups]
custom_proxy_group=ALL`select`.*
[server]
enable_cache=false
listen=0.0.0.0
port=25500
